    <!-- PWA Global Early Listener (Captures beforeinstallprompt immediately on boot) -->
    <script>
      (function() {
        var isStandalone = window.matchMedia('(display-mode: standalone)').matches ||
          (window.navigator && window.navigator.standalone === true) ||
          document.referrer.includes('android-app://');

        window.__arixonPwaState = {
          deferredPrompt: null,
          isInstalled: isStandalone,
          promptTimestamp: null,
          listeners: new Set(),
        };

        window.addEventListener('beforeinstallprompt', function(e) {
          e.preventDefault();
          window.__arixonPwaState.deferredPrompt = e;
          window.__arixonPwaState.promptTimestamp = Date.now();
          window.dispatchEvent(new CustomEvent('arixon:pwa-prompt-ready', { detail: e }));
          window.__arixonPwaState.listeners.forEach(function(fn) {
            try { fn(e); } catch(err) {}
          });
        });

        window.addEventListener('appinstalled', function() {
          window.__arixonPwaState.isInstalled = true;
          window.__arixonPwaState.deferredPrompt = null;
          window.dispatchEvent(new CustomEvent('arixon:pwa-app-installed'));
          window.__arixonPwaState.listeners.forEach(function(fn) {
            try { fn(null); } catch(err) {}
          });
        });
      })();
    </script>
